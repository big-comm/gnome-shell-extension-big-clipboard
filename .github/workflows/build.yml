name: Build CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  UUID: big-clipboard@communitybig.org

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: ./.github/actions/setup

      - name: Install Gettext
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext

      - name: Check translation catalogs
        run: make check-pot check-po

      - name: Typecheck and regression tests
        run: |
          pnpm exec tsc --noEmit
          pnpm test
          python3 -m unittest discover -s tests -p 'test_uuid_migration.py'

      - name: Lint
        run: make lint

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          fetch-tags: true
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          install-gnome-extensions-tool: 'true'

      - name: Build
        run: RELEASE=1 make build

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          path: dist/${{ env.UUID }}.zip
          archive: false
